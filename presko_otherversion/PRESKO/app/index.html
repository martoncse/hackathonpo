<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Presko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<script>try { const t = localStorage.getItem("presko:theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<style>
/* "Sunbreaker": colour means heat, everything else is shade. Concrete neutrals, ink actions, 4H colours only for meaning.
   Layout: sticky header (56 / 96 px); admin = forecast strip over map + status rail; school = phone column of numbered cards. */
:root {
  --bg: #E9ECE8; --surface: #FFFFFF; --raised: #FFFFFF; --sunk: #DEE3DD; --ink: #121C18; --ink-2: #3C4944; --muted: #5A6762;
  --line: #CBD2CC; --line-strong: #9AA59F; --on-ink: #FFFFFF; --focus: #121C18;
  --ground: #E4E8E2; --ground-side: #C9D0C9; --scene-top: #F5F6F3; --scene-bot: #DCE1DB;
  --HAYO: #1E7F4F; --HINAY: #E8A317; --HINGA: #D2401F; --HINTO: #6B3FA0;
  --HAYO-t: #FFFFFF; --HINAY-t: #1A1200; --HINGA-t: #FFFFFF; --HINTO-t: #FFFFFF;
  --full: #1E7F4F; --split: #E8A317; --splitPartial: #E87722; --home: #D2401F; --request: #1F63B8; --stop: #6B3FA0;
  --split-edge: #8A5A00; --splitPartial-edge: #9C4A0B;
  --ok: #1A7A47; --warn: #8A5A00; --bad: #A3201A; --late-t: #FFFFFF;
  --card-shadow: 0 1px 0 var(--line), 0 1px 3px rgb(18 28 24 / .06); --card-border: transparent;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Atkinson Hyperlegible Next", Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  --r-sm: 4px; --r-md: 8px; --tint: 12%;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0A0F0D; --surface: #141C19; --raised: #1C2622; --sunk: #0F1513; --ink: #ECF1EE; --ink-2: #BFCBC5; --muted: #8FA19A;
  --line: #26312D; --line-strong: #3A4842; --on-ink: #0A0F0D; --focus: #FFFFFF;
  --ground: #18211E; --ground-side: #0F1513; --scene-top: #131B18; --scene-bot: #090D0C;
  --HAYO: #3DBE7A; --HINAY: #F2B630; --HINGA: #FF6A3D; --HINTO: #B48CF0;
  --HAYO-t: #04140B; --HINAY-t: #1A1200; --HINGA-t: #1A0600; --HINTO-t: #14062A;
  --full: #3DBE7A; --split: #F2B630; --splitPartial: #FF9A4D; --home: #FF6A3D; --request: #6AA8FF; --stop: #B48CF0;
  --split-edge: transparent; --splitPartial-edge: transparent;
  --ok: #5FD39A; --warn: #F2C14E; --bad: #FF8A80; --late-t: #0A0F0D;
  --card-shadow: none; --card-border: var(--line); --tint: 18%; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0A0F0D; --surface: #141C19; --raised: #1C2622; --sunk: #0F1513; --ink: #ECF1EE; --ink-2: #BFCBC5; --muted: #8FA19A;
  --line: #26312D; --line-strong: #3A4842; --on-ink: #0A0F0D; --focus: #FFFFFF;
  --ground: #18211E; --ground-side: #0F1513; --scene-top: #131B18; --scene-bot: #090D0C;
  --HAYO: #3DBE7A; --HINAY: #F2B630; --HINGA: #FF6A3D; --HINTO: #B48CF0;
  --HAYO-t: #04140B; --HINAY-t: #1A1200; --HINGA-t: #1A0600; --HINTO-t: #14062A;
  --full: #3DBE7A; --split: #F2B630; --splitPartial: #FF9A4D; --home: #FF6A3D; --request: #6AA8FF; --stop: #B48CF0;
  --split-edge: transparent; --splitPartial-edge: transparent;
  --ok: #5FD39A; --warn: #F2C14E; --bad: #FF8A80; --late-t: #0A0F0D;
  --card-shadow: none; --card-border: var(--line); --tint: 18%; color-scheme: dark }
:root[data-theme="light"] { color-scheme: light }

* { box-sizing: border-box }
html, body { margin: 0 }
body { background: var(--bg); color: var(--ink); font: 16px/1.5 var(--body) }
@media (min-width: 1100px) { body { font-size: 15px } }
h1, h2, h3 { font-family: var(--display); margin: 0; line-height: 1.1; text-wrap: balance }
h1 { font-size: 28px; font-weight: 800; letter-spacing: -.01em } h2 { font-size: 20px; font-weight: 600 } h3 { font-size: 16px; font-weight: 600; font-family: var(--body) }
@media (max-width: 699px) { h1 { font-size: 24px } }
p { margin: 0 }
a { color: var(--ink); text-underline-offset: 3px }
.muted { color: var(--muted) } .ink2 { color: var(--ink-2) } .small { font-size: 14px; line-height: 1.45 } .mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.cap { font: 500 12px/1.2 var(--mono); letter-spacing: .08em; text-transform: uppercase; color: var(--muted) }
.ok { color: var(--ok); font-weight: 600 } .bad { color: var(--bad); font-weight: 600 } .warn { color: var(--warn); font-weight: 600 }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px }

/* buttons */
button, select, input, textarea { font: inherit; color: var(--ink) }
button { border-radius: var(--r-sm); border: 1px solid var(--line-strong); background: var(--surface); padding: 10px 16px; min-height: 44px; cursor: pointer; font-weight: 600; transition: border-color .15s, background .15s }
button:hover:not(:disabled) { border-color: var(--ink) }
button:active:not(:disabled) { transform: translateY(1px) }
button:disabled { background: var(--sunk); color: var(--muted); border-color: var(--sunk); cursor: not-allowed }
.btn-primary { background: var(--ink); color: var(--on-ink); border-color: var(--ink); min-height: 48px }
.btn-primary:hover:not(:disabled) { background: color-mix(in srgb, var(--ink) 88%, var(--surface)) }
.btn-link { background: none; border: 0; padding: 6px 0; min-height: 36px; text-decoration: underline; text-underline-offset: 3px; font-weight: 600 }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: 14px }
.full { width: 100% }
@media (max-width: 699px) { .btn-primary { min-height: 52px } }
.reason { font-size: 14px; color: var(--muted); margin-top: 4px }
input, select, textarea { background: var(--raised); border: 1px solid var(--line-strong); border-radius: var(--r-sm); padding: 9px 10px; min-height: 44px; font-size: 16px }
textarea { width: 100%; min-height: 76px; resize: vertical }
input[aria-invalid="true"] { border-color: var(--bad); box-shadow: 0 0 0 1px var(--bad) }

/* segmented control (exclusive choices only) */
.seg { display: inline-flex; background: var(--sunk); border-radius: 999px; padding: 3px; gap: 2px; flex-wrap: wrap }
.seg button { border: 0; background: transparent; border-radius: 999px; min-height: 36px; padding: 6px 14px; font-size: 14px; color: var(--ink-2) }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgb(0 0 0 / .12) }
:root[data-theme="dark"] .seg button[aria-pressed="true"] { background: var(--raised); box-shadow: inset 0 0 0 1px var(--line) }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .seg button[aria-pressed="true"] { background: var(--raised); box-shadow: inset 0 0 0 1px var(--line) } }
.seg.lg button { min-height: 44px; flex: 1 }
.seg.lg { display: flex }
.seg .n { font-family: var(--mono); margin-left: 6px } .seg .n.zero { color: var(--muted) }

/* toggle chips (multi-select) */
.tchips { display: flex; gap: 8px; flex-wrap: wrap }
.tchip { min-height: 44px; font-size: 14px }
.tchip[aria-pressed="true"] { border: 1.5px solid var(--ok); color: var(--ok) }
.tchips.pulse { animation: pulse .6s ease } @keyframes pulse { 50% { background: var(--sunk) } }

/* status: dot + words */
.st { display: inline-flex; align-items: center; gap: 8px; font-weight: 600 }
.st i { width: 8px; height: 8px; border-radius: 50%; background: currentColor; flex: none }
.st--official { color: var(--ok) } .st--awaiting-sdo { color: var(--warn) } .st--returned, .st--stale-forecast, .st--stale-inputs, .st--bad, .st--late { color: var(--bad) }
.st--none { color: var(--muted) } .st--none i { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor }

/* level tag, plan label, flag */
.lvl { display: inline-flex; align-items: stretch; border-radius: var(--r-sm); overflow: hidden; font: 800 15px/1 var(--display); letter-spacing: .03em; justify-self: start; align-self: start }
.lvl b { padding: 6px 10px; font-weight: 800 } .lvl span { padding: 6px 8px; font: 600 12px/1.25 var(--mono); border-left: 1px solid color-mix(in srgb, currentColor 35%, transparent); display: flex; align-items: center }
.lvl.xl { font-size: 40px } .lvl.xl b { padding: 8px 14px } .lvl.xl span { font-size: 16px; padding: 8px 12px }
@media (max-width: 699px) { .lvl.xl { font-size: 34px } }
.lvl.HAYO { background: var(--HAYO); color: var(--HAYO-t) } .lvl.HINAY { background: var(--HINAY); color: var(--HINAY-t) } .lvl.HINGA { background: var(--HINGA); color: var(--HINGA-t) } .lvl.HINTO { background: var(--HINTO); color: var(--HINTO-t) }
.plan { display: inline-flex; align-items: center; gap: 8px; font-weight: 600 }
.sym { width: 18px; height: 18px; display: inline-block; flex: none }
.flag { display: inline-block; font: 600 13px/1 var(--body); padding: 5px 8px; border-radius: var(--r-sm) }
.flag.green { background: var(--full); color: var(--HAYO-t) } .flag.amber { background: var(--split); color: var(--HINAY-t) } .flag.red { background: var(--home); color: var(--HINGA-t) }
.ring { display: inline-flex; font: 600 12px/1 var(--body); padding: 4px 7px; border-radius: var(--r-sm); border: 1px solid currentColor; white-space: nowrap }
.ring.okc { color: var(--ok) } .ring.warnc { color: var(--warn) } .ring.badc { color: var(--bad) } .ring.mutedc { color: var(--muted) }

/* cards, hero tint, banners */
.card { background: var(--surface); border: 1px solid var(--card-border); box-shadow: var(--card-shadow); border-radius: var(--r-md); padding: 20px; display: grid; gap: 14px; min-width: 0; align-content: start; position: relative }
@media (max-width: 699px) { .card { padding: 16px } }
.divider { border: 0; border-top: 1px solid var(--line); margin: 2px 0; width: 100% }
.hero { background: color-mix(in srgb, var(--lvl, var(--line)) var(--tint), var(--surface)); border-left: 6px solid var(--lvl, var(--line-strong)); border-radius: var(--r-md); padding: 16px; display: grid; gap: 10px; position: relative; overflow: hidden }
.hero.unrec::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: repeating-linear-gradient(-45deg, transparent 0 10px, color-mix(in srgb, var(--ink) 7%, transparent) 10px 12px); transition: opacity .3s }
.hero.wait { background: var(--sunk); border-left-color: var(--line-strong) }
.banner { padding: 12px 14px; border-radius: var(--r-sm); background: var(--sunk); font-size: 15px }
.banner.err { background: color-mix(in srgb, var(--bad) 12%, var(--surface)); border-left: 4px solid var(--bad) }
.banner.replay { background: var(--ink); color: var(--on-ink); min-height: 56px; display: flex; align-items: center; gap: 14px; padding: 8px 12px; font: 700 13px var(--mono); letter-spacing: .06em; text-transform: uppercase }
.banner.replay .louver { width: 28px; align-self: stretch; background: repeating-linear-gradient(90deg, currentColor 0 2px, transparent 2px 6px); border-radius: 2px }
.banner.replay button { margin-left: auto; background: var(--on-ink); color: var(--ink); border-color: var(--on-ink); text-transform: none; letter-spacing: 0; font-family: var(--body) }
.preview-tag { font: 700 12px var(--mono); letter-spacing: .08em; padding: 4px 8px; border: 2px dashed var(--ink); border-radius: var(--r-sm) }
#sr-status { position: fixed; left: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 50; background: var(--ink); color: var(--on-ink); border-radius: var(--r-sm); padding: 10px 14px; font-size: 15px; max-width: min(420px, calc(100vw - 32px)); transition: opacity .2s }
#sr-status:empty { opacity: 0; pointer-events: none }
@media (max-width: 699px) { #sr-status { left: 50%; transform: translateX(-50%) } }
details > summary { cursor: pointer; font-weight: 600; min-height: 44px; display: flex; align-items: center; gap: 8px; list-style: none }
details > summary::-webkit-details-marker { display: none }
details > summary::before { content: "▸"; display: inline-block; transition: transform .15s; font-size: 14px }
details[open] > summary::before { transform: rotate(90deg) }

/* header */
header.app { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line) }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--surface); z-index: 21 }
.hdr { max-width: 1360px; margin: 0 auto; min-height: 56px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 14px }
.wordmark { display: flex; align-items: center; gap: 8px; text-decoration: none; color: var(--ink) }
.wordmark i { display: flex; gap: 2px } .wordmark i::before, .wordmark i::after, .wordmark i span { content: ""; width: 3px; height: 14px; background: var(--ink); display: block }
.wordmark b { font: 800 20px var(--display) }
.ctx { color: var(--ink-2); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px }
.demo-tag { font: 500 11px var(--mono); letter-spacing: .08em; padding: 3px 6px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); color: var(--ink-2); text-decoration: none }
nav.tabs { display: flex; gap: 2px; align-items: center }
nav.tabs a { text-decoration: none; color: var(--ink-2); padding: 0 10px; min-height: 44px; display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 600; border-bottom: 3px solid transparent }
nav.tabs a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink) }
nav.tabs select { min-height: 36px; font-size: 14px; font-weight: 600; border-color: var(--line); padding: 4px 8px }
.badge { font: 700 12px var(--mono); color: var(--warn); border: 1px solid var(--warn); border-radius: 999px; padding: 1px 6px }
.spacer { flex: 1 }
.hchip { font: 700 13px var(--mono); padding: 5px 8px; border-radius: var(--r-sm); background: var(--sunk); white-space: nowrap }
.count { font: 700 13px var(--mono); padding: 4px 8px; border-radius: var(--r-sm); background: var(--sunk); white-space: nowrap; display: inline-block }
.count.soon { background: var(--ink); color: var(--on-ink) } .count.late { background: var(--bad); color: var(--late-t) }
.iconbtn { min-width: 44px; padding: 0 10px; font-size: 18px }
.hdr-row2 { display: none }
@media (max-width: 699px) {
  .hdr { min-height: 52px; gap: 8px } .ctx, .hdr nav.tabs, .demo-tag { display: none }
  .hdr-row2 { display: flex; overflow-x: auto; scrollbar-width: none; max-width: 100vw; padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); border-top: 1px solid var(--line) }
  .hdr-row2::-webkit-scrollbar { display: none }
  .hdr-row2 nav.tabs { flex-wrap: nowrap } .hdr-row2 nav.tabs a { white-space: nowrap }
  .hdr .iconbtn.theme { display: none }
}
main { max-width: 1360px; margin: 0 auto; padding-block: 20px 72px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 16px }
main.replaying { outline: 2px dashed var(--ink-2); outline-offset: -6px; border-radius: var(--r-md) }

/* heat ruler */
.ruler { position: relative; padding-top: 34px; padding-bottom: 34px }
.ruler .band { display: flex; gap: 2px; height: 10px }
.ruler .band div { border-radius: 2px; opacity: .35 } .ruler .band div.on { opacity: 1 }
.ruler .names { display: flex; gap: 2px; margin-top: 6px } .ruler .names span { font: 500 12px var(--mono); letter-spacing: .06em; color: var(--muted) } .ruler .names span.on { color: var(--ink); font-weight: 700 }
.ruler .mk { position: absolute; top: 12px; width: 2px; height: 22px; background: var(--ink); transform: translateX(-1px); transition: left .4s cubic-bezier(.2,.8,.2,1) }
.ruler .mk b { position: absolute; bottom: 24px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--on-ink); font: 700 13px var(--mono); padding: 2px 6px; border-radius: var(--r-sm); white-space: nowrap }
.ruler .mk.draft { background: none; border-left: 2px dashed var(--ink) } .ruler .mk.draft b { background: var(--surface); color: var(--ink); border: 1px dashed var(--ink); bottom: auto; top: 24px }
.ruler .city { position: absolute; bottom: 4px; transform: translateX(-50%); font: 500 12px var(--mono); color: var(--ink-2); white-space: nowrap }
.ruler .city::before { content: ""; position: absolute; left: 50%; top: -14px; width: 1px; height: 10px; background: var(--ink-2) }
@media (max-width: 499px) { .ruler .names { display: none } .ruler .bounds { display: flex !important } .ruler .city { display: none } }
.ruler .bounds { display: none; position: relative; height: 16px; margin-top: 6px } .ruler .bounds span { position: absolute; transform: translateX(-50%); font: 500 12px var(--mono); color: var(--muted) }

/* admin */
.strip { display: grid; grid-template-columns: minmax(220px, auto) minmax(0, 1fr) minmax(280px, 340px); gap: 24px; align-items: start }
.strip.preview { outline: 2px dashed var(--ink); outline-offset: 4px }
.hero-num { font: 800 72px/.9 var(--display); letter-spacing: -.02em; font-variant-numeric: tabular-nums }
@media (max-width: 699px) { .hero-num { font-size: 56px } }
.legal { grid-column: 1 / -1; border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; font-size: 14px; color: var(--ink-2) }
.legal select { min-height: 36px; font-size: 14px; padding: 4px 8px }
.body2 { display: grid; grid-template-columns: minmax(0, 2fr) minmax(300px, 1fr); gap: 16px; align-items: start }
.scene { position: relative; border-radius: var(--r-md); overflow: hidden; background: linear-gradient(var(--scene-top), var(--scene-bot)); min-height: 320px }
.scene.div3d { height: clamp(440px, 62vh, 700px) }
.scene .c3d { position: absolute; inset: 0 } .scene canvas { display: block; width: 100%; height: 100%; touch-action: none }
.scene svg.map { display: block; width: 100%; height: auto; padding: 12px }
.scene .tools { position: absolute; top: 10px; right: 10px; display: flex; gap: 6px; flex-wrap: wrap; justify-content: end; z-index: 2 }
.scene .tools .seg button, .scene .tools > button { min-height: 36px; font-size: 13px }
.scene .tools > button { background: var(--surface) }
.scene .hint { position: absolute; top: 12px; left: 12px; font-size: 14px; color: var(--ink-2); background: color-mix(in srgb, var(--surface) 85%, transparent); padding: 4px 8px; border-radius: var(--r-sm) }
.scene .scale { position: absolute; right: 12px; bottom: 10px; font: 500 11px var(--mono); color: var(--muted) }
.scene.preview { outline: 2px dashed var(--ink); outline-offset: -2px }
.legend-map { position: absolute; left: 10px; bottom: 10px; background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(6px); border-radius: var(--r-sm); padding: 8px 10px; display: grid; gap: 4px; z-index: 2 }
.legend-map span, .legend-row span { display: flex; align-items: center; gap: 8px; font-size: 14px } .legend-map .n, .legend-row .n { font-family: var(--mono); margin-left: auto; padding-left: 10px }
.legend-map .absent, .legend-row .absent { opacity: .4 }
.legend-row { display: flex; flex-wrap: wrap; gap: 6px 16px }
.tip { position: absolute; pointer-events: none; background: var(--raised); border-radius: var(--r-sm); padding: 8px 10px; font-size: 14px; box-shadow: 0 8px 24px rgb(0 0 0 / .18); z-index: 3; display: grid; gap: 4px; max-width: 260px }
.sbar { display: flex; height: 12px; background: var(--sunk); border-radius: 999px; overflow: hidden; gap: 2px }
.sbar div { min-width: 4px } .sbar .s-ok { background: var(--ok) } .sbar .s-warn { background: var(--warn) } .sbar .s-bad { background: var(--bad) } .sbar .s-none { background: var(--line-strong) }
.counts { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 14px } .counts a { text-decoration: none; color: inherit } .counts .zero { color: var(--muted) }
.pbar { display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font-size: 14px }
.pbar .bar { grid-column: 2 / 4; height: 6px; border-radius: 3px }
.kpi { font: 800 40px/1 var(--display); font-variant-numeric: tabular-nums }
@media (max-width: 1099px) { .strip, .body2 { grid-template-columns: minmax(0, 1fr) } .scene.div3d { height: 420px } }
table { border-collapse: collapse; width: 100%; font-size: 15px }
th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line); vertical-align: middle }
thead th { position: sticky; top: 0; background: var(--surface); font: 500 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted) }
tr.less td:first-child { box-shadow: inset 3px 0 0 var(--bad) }
.tbl { overflow-x: auto }

/* school */
.school { display: grid; grid-template-columns: minmax(0, 520px) minmax(0, 1fr); gap: 16px; align-items: start }
.school .side { position: sticky; top: 72px }
