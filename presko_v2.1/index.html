<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Presko</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Next:wght@400;600&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
<script>try { const t = localStorage.getItem("presko:theme"); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<link rel="stylesheet" href="./ui/theme.css">
<style>
/* Presko 2.0 on the Sunbreaker system. Principal screen: one column, big type, one decision per card. */
.wrap1 { max-width: 640px; margin: 0 auto; width: 100%; display: grid; gap: 16px }
.big { font-size: 20px; line-height: 1.4 }
.huge { font: 800 30px/1.15 var(--display) }
@media (max-width: 699px) { .huge { font-size: 26px } }
.step { display: flex; gap: 12px; align-items: center }
.step .n { width: 32px; height: 32px; border-radius: 50%; background: var(--ink); color: var(--on-ink); font: 700 15px var(--mono); display: grid; place-items: center; flex: none }
.step .n.done { background: var(--ok) }
.why { margin: 0; padding-left: 20px; display: grid; gap: 6px; font-size: 17px }
.answer { font: 600 18px var(--body); padding: 12px 14px; border-radius: var(--r-sm); background: var(--sunk) }
.answer.ok { background: color-mix(in srgb, var(--ok) 14%, var(--surface)); color: var(--ink) }
.answer.wait { background: color-mix(in srgb, var(--warn) 16%, var(--surface)); color: var(--ink) }
.btn-xl { min-height: 60px; font-size: 19px; width: 100% }
.opt { display: flex; gap: 12px; align-items: center; min-height: 56px; padding: 10px 14px; border: 1px solid var(--line-strong); border-radius: var(--r-sm); font-size: 18px; cursor: pointer }
.opt:has(input:checked) { border: 2px solid var(--ink); background: var(--sunk) }
.opt input { width: 22px; height: 22px; min-height: auto }
.rd { display: grid; grid-template-columns: minmax(0, 1fr) repeat(3, 84px); gap: 8px; align-items: center }
.rd input { width: 84px; min-height: 52px; font: 700 20px var(--mono); text-align: right }
.rd .h { font: 600 13px var(--mono); color: var(--muted); text-align: center }
@media (max-width: 499px) { .rd { grid-template-columns: repeat(3, minmax(0, 1fr)) } .rd .bn { grid-column: 1 / -1 } .rd input { width: 100% } }
.bline { display: flex; gap: 10px; align-items: baseline; font-size: 17px; border-top: 1px solid var(--line); padding-top: 10px }
.bline:first-child { border-top: 0; padding-top: 0 }
.kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 4px 16px; font-size: 15px }
.kv div span { color: var(--muted) }
.scene.sch { height: 300px; min-height: 0 }
.demo-bar { max-width: 1360px; margin: 0 auto; padding: 0 16px 24px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; font-size: 14px; color: var(--muted) }
.demo-bar select { min-height: 36px; font-size: 14px }
.nav2 { display: grid; border: 1px solid var(--line); border-radius: var(--r-md); overflow: hidden }
.nav2 button { display: grid; grid-template-columns: 1fr auto auto; gap: 12px; align-items: center; text-align: left; border: 0; border-top: 1px solid var(--line); border-radius: 0; background: var(--surface); padding: 14px 16px; min-height: 64px }
.nav2 button:first-child { border-top: 0 }
.nav2 button:hover { background: var(--sunk) }
.rail { display: grid; gap: 16px; align-content: start }
.req { border-top: 1px solid var(--line); padding-top: 12px; display: grid; gap: 8px }
.req:first-of-type { border-top: 0; padding-top: 0 }
.strip2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(12px, 1fr)); gap: 3px }
.strip2 i { height: 22px; border-radius: 3px; display: block }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px }
.kpis .card { gap: 4px }
.out { white-space: pre-wrap; font: 14px/1.55 var(--mono); background: var(--sunk); border-radius: var(--r-sm); padding: 14px }
tr.click { cursor: pointer } tr.click:hover td { background: var(--sunk) }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums }
/* popups */
dialog { border: 0; border-radius: var(--r-md); background: var(--surface); color: var(--ink); padding: 0; width: min(520px, calc(100vw - 24px)); max-height: calc(100vh - 24px); box-shadow: 0 20px 60px rgb(0 0 0 / .3) }
dialog::backdrop { background: rgb(10 15 13 / .6) }
.dlg { display: grid; gap: 14px; padding: 20px }
.phone { background: var(--sunk); border-radius: 22px; padding: 16px 14px; display: grid; gap: 10px }
.bubble { background: var(--surface); border-radius: 16px 16px 16px 4px; padding: 12px 14px; white-space: pre-wrap; font-size: 17px; max-width: 94% }
.bubble.me { background: var(--ink); color: var(--on-ink); border-radius: 16px 16px 4px 16px; justify-self: end }
</style>
</head>
<body>
<header class="app"><div class="hdr" id="hdr"></div><div class="hdr-row2" id="hdr2" hidden></div></header>
<main id="main"></main>
<div class="demo-bar" id="demoBar" hidden></div>

<dialog id="smsDlg" aria-labelledby="smsT"><div class="dlg">
  <h2 id="smsT">New text message</h2>
  <div class="phone" id="phone"></div>
  <p class="small muted">Demo only. In real use this arrives on your phone at 4:00 PM.</p>
  <button class="btn-primary btn-xl" data-close>OK</button>
</div></dialog>

<dialog id="parentDlg" aria-labelledby="pT"><div class="dlg">
  <div class="stephead"><h2 id="pT">Notify parents and guardians</h2><button class="iconbtn" data-close aria-label="Close">×</button></div>
  <p class="big" id="pIntro"></p>
  <div class="seg lg" id="pLang"></div>
  <p class="small warn" id="pDraft" hidden>Translated draft: please check the wording.</p>
  <label for="pText"><b>Message</b> <span class="small muted">(you can edit before sending)</span></label>
  <textarea id="pText" rows="6" style="font-size:18px"></textarea>
  <p class="small muted" id="pCount"></p>
  <div class="row" style="justify-content:flex-end"><button data-close>Cancel</button><button class="btn-primary" id="pSend">Confirm and broadcast</button></div>
</div></dialog>

<div id="sr-status" role="status" aria-live="polite"></div>
<script type="module" src="./app.js"></script>
</body>
</html>
