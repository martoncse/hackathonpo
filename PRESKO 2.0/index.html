<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head>
<body>
<title>Presko Iloilo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one input per role. Division office: forecast in, status out. School head: buildings in, decision out. */
:root {
  --bg: #f4f6f5; --surface: #ffffff; --sunk: #edf1ef; --ink: #121c19; --muted: #66756f; --line: #dbe2df;
  --accent: #0e6c64; --accent-ink: #ffffff;
  --full: #2e8b57; --morning: #c98a10; --partial: #d4602a; --adm: #b3261e; --afternoon: #6a55b8;
  --body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0d1412; --surface: #151f1c; --sunk: #1b2724; --ink: #e4ede9; --muted: #95a8a2; --line: #26332f;
  --accent: #4fb3a7; --accent-ink: #062320;
  --full: #4fbf86; --morning: #efb547; --partial: #f08a55; --adm: #ef6a60; --afternoon: #a493ea; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0d1412; --surface: #151f1c; --sunk: #1b2724; --ink: #e4ede9; --muted: #95a8a2; --line: #26332f;
  --accent: #4fb3a7; --accent-ink: #062320;
  --full: #4fbf86; --morning: #efb547; --partial: #f08a55; --adm: #ef6a60; --afternoon: #a493ea; color-scheme: dark }

* { box-sizing: border-box }
[hidden] { display: none !important }
body { background: var(--bg); color: var(--ink); font: 14px/1.45 var(--body) }
.wrap { max-width: 880px; margin: 0 auto; padding-block: 16px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 12px }
.mono { font-family: var(--mono); font-variant-numeric: tabular-nums }
.muted { color: var(--muted) }
button, select, input { font: inherit; color: var(--ink) }
button { border: 1px solid var(--line); background: var(--surface); border-radius: 7px; padding: 7px 12px; cursor: pointer }
button:hover { border-color: var(--accent) }
button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent) }
select, input[type=number] { background: var(--surface); border: 1px solid var(--line); border-radius: 7px; padding: 6px 8px }
input[type=checkbox] { accent-color: var(--accent); width: 16px; height: 16px; vertical-align: middle }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; min-width: 0 }

.top { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px }
.brand { font-weight: 700; font-size: 16px }
.role { display: inline-flex; background: var(--sunk); border-radius: 8px; padding: 2px; gap: 2px; margin-left: auto }
.role button { border: 0; background: transparent; padding: 5px 12px; font-weight: 600; color: var(--muted) }
.role button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 0 0 1px var(--line) }

.field { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px }
.field label { font-weight: 600 }
.hi { width: 96px; font: 700 22px var(--mono); text-align: right }
.cat { font-weight: 600; padding: 3px 10px; border-radius: 99px; background: var(--sunk) }
.c3, .c4 { color: var(--adm) } .c2 { color: var(--morning) }

.sumline { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px }
.ok { color: var(--full); font-weight: 600 }
table { border-collapse: collapse; width: 100% }
th, td { text-align: left; padding: 7px 6px; border-bottom: 1px solid var(--line) }
th { font-size: 11px; font-weight: 600; color: var(--muted) }
tr.row { cursor: pointer } tr.row:hover td { background: var(--sunk) }
.scroll { max-height: 60vh; overflow: auto }
.badge { display: inline-block; font-weight: 600; font-size: 12px; padding: 2px 8px; border-radius: 99px; color: #fff; white-space: nowrap }
.b-full { background: var(--full) } .b-morning { background: var(--morning) } .b-afternoon { background: var(--afternoon) } .b-partial { background: var(--partial) } .b-adm { background: var(--adm) }
.hours svg { display: block; width: 100%; height: auto }
.win { display: inline-flex; align-items: center; gap: 8px }
.win input { width: 80px; font: 700 18px var(--mono); text-align: right }
.src2 { font-size: 12px; color: var(--muted) }

.decide { display: grid; gap: 12px }
.decide .plan { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px }
.decide .plan .badge { font-size: 15px; padding: 5px 14px }
.seg { display: inline-flex; flex-wrap: wrap; gap: 6px }
.sms { white-space: pre-wrap; background: var(--sunk); border-radius: 8px; padding: 10px 12px }
.bl { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--line) }
.bl:first-of-type { border-top: 0; padding-top: 4px }
.bl-head { display: flex; gap: 10px; align-items: center }
.band { width: 10px; height: 10px; border-radius: 50% }
.qs { display: grid; grid-template-columns: repeat(5, minmax(0, auto)); gap: 8px 16px; align-items: center; justify-content: start }
.qs label { display: inline-flex; gap: 6px; align-items: center; color: var(--muted); font-size: 13px }
.who { margin-left: auto; display: inline-flex; align-items: center; gap: 10px; font-size: 13px }
.login { max-width: 400px; width: 100%; margin: 8vh auto 0; display: grid; gap: 14px; padding: 24px }
.login h1 { margin: 0; font-size: 22px; font-weight: 700 }
.login input[type=email] { width: 100%; font: 15px var(--body); padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface) }
.login button[type=submit] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); padding: 10px; font-weight: 600 }
.login .err { color: var(--adm); font-size: 13px; min-height: 1em }
.demo { display: grid; gap: 6px }
.demo button { text-align: left; display: flex; justify-content: space-between; gap: 8px }
.demo button span { color: var(--muted); font: 12px var(--mono) }
.foot { font-size: 12px; color: var(--muted) }
.foot a { color: var(--accent) }
@media (max-width: 640px) { .qs { grid-template-columns: repeat(2, minmax(0, auto)) } .role { margin-left: 0 } }
</style>

<style>
.chips { display: flex; flex-wrap: wrap; gap: 6px }
.chips button { padding: 4px 10px; font-size: 13px }
.out { white-space: pre-wrap; font: 12px/1.5 var(--mono); background: var(--sunk); border-radius: 8px; padding: 10px 12px }
.hold { font-size: 12px; padding: 4px 6px }
.reason { color: var(--muted); font-size: 12px }
.warn { color: var(--morning); font-weight: 600 }
.rule table td, .rule table th { padding: 5px 6px }
.rule input[type=number] { width: 64px } .rule input[type=time] { border: 1px solid var(--line); border-radius: 7px; padding: 5px 8px; background: var(--surface) }
.phone { max-width: 360px; display: grid; gap: 8px }
.bubble { background: var(--sunk); border-radius: 12px 12px 12px 4px; padding: 10px 12px; white-space: pre-wrap }
.bubble.me { background: var(--accent); color: var(--accent-ink); border-radius: 12px 12px 4px 12px; justify-self: end }
.reply { display: flex; gap: 6px } .reply input { flex: 1; border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; background: var(--surface) }
.ovr { display: flex; gap: 6px; flex-wrap: wrap } .ovr input { flex: 1; min-width: 200px; border: 1px solid var(--line); border-radius: 7px; padding: 7px 10px; background: var(--surface) }
.why { font-size: 13px } .why b { font-family: var(--mono) }
.inv { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 13px }
.inv button { padding: 3px 10px; font-size: 12px }
.banner { background: var(--sunk); border-left: 4px solid var(--adm); padding: 8px 12px; border-radius: 6px }
h3 { margin: 0; font-size: 14px }
</style>

<div class="wrap">
  <form class="card login" id="login" novalidate>
    <h1>Presko</h1>
    <label for="email" class="muted">DepEd email</label>
    <input id="email" type="email" autocomplete="username" list="accounts" placeholder="name@deped.gov.ph" required>
    <datalist id="accounts"></datalist>
    <button type="submit">Sign in</button>
    <div class="err" id="err" role="alert"></div>
    <div class="demo" id="demo"></div>
    <div class="foot">Demo sign-in, no password.</div>
  </form>

  <header class="card top" id="topbar" hidden>
    <div class="brand">Presko <span class="muted" style="font-weight:500" id="brandSub">Iloilo City</span></div>
    <span class="who"><span class="muted mono" id="whoEmail"></span><button id="signout">Sign out</button></span>
  </header>

  <!-- ===== Division coordinator ===== -->
  <div id="sdo" hidden style="display:grid;gap:12px">
    <details class="card rule" id="ruleCard"><summary id="ruleSummary"></summary><div id="ruleBody" style="margin-top:10px;display:grid;gap:10px"></div></details>

    <section class="card" style="display:grid;gap:12px">
      <div class="field"><select id="source" aria-label="Weather source"></select><span class="src2" id="srcNote"></span></div>
      <div class="hours" id="hours"></div>
      <div class="field">
        <span class="win"><label for="hiAM">Morning 06–11</label><input id="hiAM" type="number" min="20" max="60" step="0.1" inputmode="decimal"><span id="catAM" class="cat"></span></span>
        <span class="win"><label for="hiPM">Afternoon 12–17</label><input id="hiPM" type="number" min="20" max="60" step="0.1" inputmode="decimal"><span id="catPM" class="cat"></span></span>
      </div>
    </section>

    <section class="card" style="display:grid;gap:12px">
      <div class="sumline" id="sum"></div>
      <div class="chips" id="filters"></div>
      <div class="chips"><button id="aRemind">Remind non-responders</button><button id="aMayor">Brief the mayor</button><button id="aRegion">Report to region</button></div>
      <div id="outBox" hidden style="display:grid;gap:6px"><div class="out" id="out"></div><div class="chips"><button id="outCopy">Copy</button><button id="outClose">Close</button></div></div>
      <div class="scroll"><table id="list"></table></div>
    </section>
  </div>

  <!-- ===== School head ===== -->
  <div id="head" hidden style="display:grid;gap:12px">
    <section class="card field"><b id="schoolName" style="font-size:16px"></b><span class="muted">Morning</span><b class="mono" id="hiRoAM"></b><span class="muted">Afternoon</span><b class="mono" id="hiRoPM"></b><span class="muted" id="cutoffRo"></span></section>
    <div id="holdBanner" class="banner" hidden></div>
    <section class="card phone" id="phone"></section>
    <section class="card" style="display:grid;gap:10px" id="reasons"></section>
    <section class="card decide" id="decide"></section>
    <section class="card decide" id="parents"></section>
    <details class="card" id="setupCard"><summary><b>Buildings</b> <span class="muted" id="setupState"></span></summary><div id="buildings" style="margin-top:8px"></div></details>
  </div>

  <div class="foot" id="sources" hidden>Weather: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo</a> hourly · <a href="https://mb.com.ph/2026/03/24/feeling-the-heat-heres-what-the-heat-index-means" target="_blank" rel="noopener">PAGASA categories</a> · Schools: <a href="https://data.humdata.org/dataset/hotosm_phl_education_facilities" target="_blank" rel="noopener">OpenStreetMap/HDX</a> · Buildings: <a href="https://support.lis.deped.gov.ph/support/Manuals/NSBI-2022-2023-User-Guide.pdf" target="_blank" rel="noopener">NSBI</a>, illustrative · Decision: DepEd Order 37, s. 2022</div>
</div>

<script type="module">
import { makeDivision, planDivision, check, pagasaCategory, band, SLOTS, checklistFromFeatures, featuresFrom, windowsFromHourly, HI_POINTS, FEATURES, FEATURE_KEYS, BAND_RULE } from "./engine.js";
import { FORECAST_SNAPSHOT, REPLAYS } from "./hourly-data.js";

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const MODE = { full: "Open all day", morning: "Afternoon closure", afternoon: "Morning closure", partial: "Partial + ADM", adm: "Closed (ADM)" };
const MCOL = { full: "var(--full)", morning: "var(--morning)", afternoon: "var(--afternoon)", partial: "var(--partial)", adm: "var(--adm)" };
const BCOL = { green: "var(--full)", amber: "var(--morning)", red: "var(--adm)" };
const SLOT_LABEL = Object.fromEntries(Object.values(SLOTS).map((s) => [s.id, s.label]));
const catIdx = (hi) => (hi >= 52 ? 4 : hi >= 42 ? 3 : hi >= 33 ? 2 : 1);
const HOLDS = { exam: { label: "Exam day", mode: "full" }, outage: { label: "Power/water outage", mode: "adm" }, evac: { label: "Evacuation centre", mode: "adm" } };
const SMS_CODES = { "1": "confirm", "2": "full", "3": "adm" };
const now = () => new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" });

const state = {
  hi: { am: 30, pm: 34 }, source: "forecast", hourly: [], day: "", live: false, manual: false, forecastDays: FORECAST_SNAPSHOT.days,
  schools: makeDivision(), school: null, lang: "en", filter: "all",
  decisions: {},  // schoolId -> { choice, reason, via, at }
  holds: {},      // schoolId -> hold key
  sent: {},       // schoolId -> true once the parent message is sent
  smsThread: {},  // schoolId -> [{me, text}]
  rule: { version: 1, approvedBy: null, approvedAt: null, cutoff: "17:00" },
};
for (const s of state.schools) for (const b of s.buildings) { b.c = checklistFromFeatures(b.features); b.inv = null; b.asked = true; }

// ---------- plans: division hold > head decision > proposal ----------
function withMode(s, p, mode) {
  if (mode === "adm") return { ...p, mode, slotsUsed: [], assignments: p.assignments.map((a) => ({ ...a, room: null, slot: "adm" })) };
  if (mode === "full") return { ...p, mode, slotsUsed: s.doubleShift ? ["am", "pm"] : ["full"] };
  if (mode === "afternoon") return { ...p, mode, slotsUsed: ["afternoon"] };
  return { ...p, mode: "morning", slotsUsed: ["morning"] };
}
function effective(s, p) {
  const h = state.holds[s.id]; if (h) return withMode(s, p, HOLDS[h].mode);
  const d = state.decisions[s.id];
  if (!d || d.choice === "confirm") return p;
  return withMode(s, p, d.choice);
}

// ---------- messages ----------
function times(p, lang) {
  const or = { en: "or", tl: "o", hil: "ukon" }[lang], and = { en: "and", tl: "at", hil: "kag" }[lang];
  if (p.slotsUsed.length === 2 && p.mode !== "full") return `${SLOT_LABEL[p.slotsUsed[0]]} ${or} ${SLOT_LABEL[p.slotsUsed[1]]}`;
  return p.slotsUsed.map((x) => SLOT_LABEL[x]).join(` ${and} `);
}
function parentMessage(s, p, lang) {
  if (p.mode === "full") return null;
  const t = times(p, lang), am = state.hi.am, pm = state.hi.pm;
  const adm = p.assignments.filter((a) => a.slot === "adm").map((a) => s.sections.find((x) => x.id === a.section).name);
  const list = adm.slice(0, 6).join(", ") + (adm.length > 6 ? ` +${adm.length - 6}` : "");
  const T = {
    en: { head: `${s.name}: heat index tomorrow ${am}°C morning, ${pm}°C afternoon.`, morning: `Morning classes only, ${t}. Home by 11:00. Bring water.`, afternoon: `Afternoon classes only, ${t}. No morning classes. Bring water.`, partial: `Most sections half day, ${t}. Modules at home: ${list}.`, adm: `No in-person classes. Modules at home (ADM).` },
    tl: { head: `${s.name}: Heat index bukas ${am}°C sa umaga, ${pm}°C sa hapon.`, morning: `Pang-umaga lamang ang klase, ${t}. Uuwi bago mag-11:00. Magdala ng tubig.`, afternoon: `Panghapon lamang ang klase, ${t}. Walang klase sa umaga. Magdala ng tubig.`, partial: `Kalahating araw ang karamihan ng seksyon, ${t}. Modules sa bahay: ${list}.`, adm: `Walang face-to-face na klase. Modules sa bahay (ADM).` },
    hil: { head: `${s.name}: Heat index buwas ${am}°C sa aga, ${pm}°C sa hapon.`, morning: `Sa aga lang ang klase, ${t}. Mapauli antes mag-11:00. Magdala sang tubig.`, afternoon: `Sa hapon lang ang klase, ${t}. Wala sing klase sa aga. Magdala sang tubig.`, partial: `Tunga lang sang adlaw ang kalabanan nga seksyon, ${t}. Modules sa balay: ${list}.`, adm: `Wala sing face-to-face nga klase. Modules sa balay (ADM).` },
  }[lang];
  return `${T.head} ${T[p.mode]}`;
}
function headSms(s, p) {
  return `PRESKO ${s.name}\nTomorrow ${state.hi.am}°C AM / ${state.hi.pm}°C PM\nRecommended: ${MODE[p.mode].toUpperCase()}\n${p.why}\nReply 1 Confirm · 2 Open all day · 3 Close (ADM)\nby ${state.rule.cutoff}`;
}
const buildingLine = (b) => {
  const am = band(state.hi.am, b.features).band, pm = band(state.hi.pm, b.features).band;
  if (am === "red" && pm === "red") return "red all day";
  if (pm === "red") return "red after 11:00";
  if (am === "red") return "red before 11:00";
  if (am === "amber" && pm === "amber") return "amber all day";
  if (pm === "amber") return "amber after 11:00";
  if (am === "amber") return "amber before 11:00";
  return "safe all day";
};

// ---------- hourly strip ----------
function hoursSvg() {
  const hrs = state.hourly; if (!hrs.length) return "";
  const W = 600, H = 92, bw = W / 12, max = Math.max(56, ...hrs.map((x) => x.hi)), min = 20;
  const y = (v) => 70 - ((v - min) / (max - min)) * 62;
  const col = (v) => (v >= 52 ? "var(--adm)" : v >= 42 ? "var(--partial)" : v >= 33 ? "var(--morning)" : "var(--full)");
  const bars = hrs.map((x, i) => `<rect x="${i * bw + 4}" y="${y(x.hi)}" width="${bw - 8}" height="${70 - y(x.hi)}" rx="3" fill="${col(x.hi)}"><title>${x.h}:00 · ${x.hi}°C</title></rect><text x="${i * bw + bw / 2}" y="${y(x.hi) - 3}" text-anchor="middle" font-size="10" fill="var(--ink)" font-family="var(--mono)">${Math.round(x.hi)}</text><text x="${i * bw + bw / 2}" y="86" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--mono)">${String(x.h).padStart(2, "0")}</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Hourly heat index"><rect x="0" y="0" width="${bw * 5}" height="74" fill="var(--sunk)" rx="4"/><rect x="${bw * 6}" y="0" width="${bw * 5}" height="74" fill="var(--sunk)" rx="4"/>${bars}</svg>`;
}

// ---------- coordinator ----------
function renderRule() {
  const r = state.rule;
  $("ruleSummary").innerHTML = r.approvedBy ? `<b>Rule v${r.version}</b> <span class="muted">approved ${r.approvedAt} · cut-off ${r.cutoff}</span>` : `<b>Rule v${r.version}</b> <span class="warn">not approved</span>`;
  const over = Object.entries(state.decisions).filter(([, d]) => d.choice !== "confirm");
  const byType = {};
  for (const [id] of over) for (const b of state.schools[+id].buildings) byType[b.nsbi.type] = (byType[b.nsbi.type] || 0) + 1;
  $("ruleBody").innerHTML = `
    <div class="field"><label for="cutoff">Cut-off</label><input id="cutoff" type="time" value="${r.cutoff}"><span class="muted">Morning shift 06:00–11:00 · afternoon 12:00–17:00</span></div>
    <table><thead><tr><th>Heat index</th><th>Points</th></tr></thead><tbody>${HI_POINTS.map((h, i) => `<tr><td>${h.label}</td><td><input type="number" step="1" data-hip="${i}" value="${h.points}" aria-label="Points ${h.label}"></td></tr>`).join("")}</tbody></table>
    <div class="muted" style="font-size:12px">Building points: ${FEATURE_KEYS.map((k) => `${FEATURES[k].label} ${FEATURES[k].points > 0 ? "+" : ""}${FEATURES[k].points}`).join(" · ")}. Bands: ${BAND_RULE.map((b) => b.text).join(" · ")}.</div>
    <div class="chips"><button id="approve" aria-pressed="${!!r.approvedBy}">${r.approvedBy ? "Approved" : "Approve rule"}</button></div>
    ${over.length ? `<div><h3>Overrides by building type</h3><div class="muted" style="font-size:13px">${Object.entries(byType).sort((a, b) => b[1] - a[1]).map(([t, n]) => `${esc(t)} ${n}`).join(" · ")}</div></div>` : ""}`;
  $("cutoff").addEventListener("change", (e) => { r.cutoff = e.target.value || "17:00"; render(); });
  $("ruleBody").querySelectorAll("[data-hip]").forEach((el) => el.addEventListener("change", () => {
    const v = Math.round(+el.value); if (!Number.isFinite(v)) return;
    HI_POINTS[+el.dataset.hip].points = v; r.version += 1; r.approvedBy = null; r.approvedAt = null; state.decisions = {}; render();
  }));
  $("approve").addEventListener("click", () => { if (r.approvedBy) return; r.approvedBy = state.user.email; r.approvedAt = `${new Date().toISOString().slice(0, 10)} ${now()}`; render(); });
}

function rowsFor(byId) {
  return state.schools.map((s) => {
    const p = byId[s.id], d = state.decisions[s.id], h = state.holds[s.id];
    const st = h ? "hold" : !d ? "pending" : d.choice === "confirm" ? "confirm" : "override";
    return { s, p, d, h, st, ep: effective(s, p) };
  });
}

function renderSdo(div, byId, conflicts) {
  renderRule();
  $("source").value = state.source;
  $("srcNote").textContent = state.manual ? "Edited by hand" : state.source === "forecast" ? `Open-Meteo hourly · ${state.day} · ${state.live ? "live" : `snapshot ${FORECAST_SNAPSHOT.fetchedAt.slice(11, 16)} UTC`}` : `Open-Meteo archive · ${state.source}`;
  $("hiAM").value = state.hi.am; $("hiPM").value = state.hi.pm;
  for (const w of ["AM", "PM"]) { const v = state.hi[w.toLowerCase()]; $(`cat${w}`).textContent = pagasaCategory(v); $(`cat${w}`).className = `cat c${catIdx(v)}`; }
  $("hours").innerHTML = hoursSvg();
  const rows = rowsFor(byId);
  const tally = { full: 0, morning: 0, afternoon: 0, partial: 0, adm: 0 }; rows.forEach((r) => tally[r.ep.mode]++);
  const n = { all: rows.length, pending: 0, override: 0, hold: 0, confirm: 0 }; rows.forEach((r) => n[r.st]++);
  $("sum").innerHTML = Object.keys(tally).map((m) => `<span><i class="dot" style="background:${MCOL[m]}"></i>${MODE[m]} <b class="mono">${tally[m]}</b></span>`).join("") +
    `<span class="${conflicts ? "" : "ok"}">${conflicts} conflicts</span>${state.rule.approvedBy ? "" : `<span class="warn">Rule not approved</span>`}`;
  $("filters").innerHTML = [["all", "All"], ["pending", `${n.pending} of ${n.all} not confirmed`], ["override", "Overrides"], ["hold", "Holds"]].map(([k, l]) => `<button data-f="${k}" aria-pressed="${state.filter === k}">${l}${k !== "pending" && k !== "all" ? ` <span class="mono">${n[k]}</span>` : ""}</button>`).join("");
  $("filters").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { state.filter = b.dataset.f; render(); }));
  const order = { pending: 0, override: 1, hold: 2, confirm: 3 };
  const shown = rows.filter((r) => state.filter === "all" || r.st === state.filter).sort((a, b) => order[a.st] - order[b.st] || a.s.name.localeCompare(b.s.name));
  $("list").innerHTML = `<thead><tr><th>School</th><th>Plan</th><th>Head</th><th>Hold</th></tr></thead><tbody>` + shown.map(({ s, p, d, h, st, ep }) => {
    const plan = `<span class="badge b-${ep.mode}">${MODE[ep.mode]}</span>${ep.mode !== p.mode ? ` <span class="reason">was ${MODE[p.mode]}</span>` : ""}`;
    const head = st === "pending" ? `<span class="muted">Pending</span>` : st === "hold" ? `<span class="muted">—</span>` : st === "confirm" ? `<span class="ok">Confirmed</span>${d.via === "sms" ? ` <span class="reason">SMS</span>` : ""}` : `Override${d.via === "sms" ? " (SMS)" : ""}<div class="reason">${esc(d.reason || "")}</div>`;
    const hold = `<select class="hold" data-hold="${s.id}" aria-label="Hold"><option value="">—</option>${Object.entries(HOLDS).map(([k, v]) => `<option value="${k}" ${h === k ? "selected" : ""}>${v.label}</option>`).join("")}</select>`;
    return `<tr><td>${esc(s.name)}</td><td>${plan}</td><td>${head}</td><td>${hold}</td></tr>`;
  }).join("") + "</tbody>";
  $("list").querySelectorAll("[data-hold]").forEach((el) => el.addEventListener("change", () => { if (el.value) state.holds[el.dataset.hold] = el.value; else delete state.holds[el.dataset.hold]; render(); }));
}

function showOut(text) { $("outBox").hidden = false; $("out").textContent = text; }
function reportText(kind) {
  const div = planDivision(state.schools, state.hi);
  const byId = Object.fromEntries(div.plans.map((p) => [p.school, p]));
  const rows = rowsFor(byId);
  const tally = { full: 0, morning: 0, afternoon: 0, partial: 0, adm: 0 }; rows.forEach((r) => tally[r.ep.mode]++);
  const day = state.day || "tomorrow";
  const counts = Object.keys(tally).map((m) => `${MODE[m]}: ${tally[m]}`).join("\n");
  if (kind === "remind") {
    const pend = rows.filter((r) => r.st === "pending");
    return `To ${pend.length} school heads (not confirmed):\n${pend.map((r) => `- ${r.s.name}`).join("\n")}\n\nSMS: PRESKO reminder. Please reply 1, 2 or 3 for tomorrow's plan before ${state.rule.cutoff}.`;
  }
  if (kind === "mayor") {
    const closing = rows.filter((r) => r.ep.mode !== "full");
    return `Brief for the City Mayor · ${day}\nHeat index: ${state.hi.am}°C morning (${pagasaCategory(state.hi.am)}), ${state.hi.pm}°C afternoon (${pagasaCategory(state.hi.pm)})\n\n${counts}\n\nSchools not on a full day (${closing.length}):\n${closing.map((r) => `- ${r.s.name}: ${MODE[r.ep.mode]}`).join("\n")}\n\nAll other schools open as normal. A targeted order covering only these schools is sufficient.`;
  }
  return `SDO Iloilo City · report to Region VI · ${day} · as of ${now()}\nSchools: ${rows.length}\nHeads confirmed: ${rows.filter((r) => r.st === "confirm").length} · overrides: ${rows.filter((r) => r.st === "override").length} · division holds: ${rows.filter((r) => r.st === "hold").length} · not confirmed: ${rows.filter((r) => r.st === "pending").length}\n\n${counts}\n\nRule v${state.rule.version}${state.rule.approvedBy ? ` approved ${state.rule.approvedAt}` : " (not approved)"}`;
}

// ---------- school head ----------
function decide(s, choice, reason, via) {
  state.decisions[s.id] = { choice, reason: reason || "", via, at: now() };
  delete state.sent[s.id];
}
function renderHead(byId) {
  const s = state.schools.find((x) => x.id === state.school);
  const p = byId[s.id], ep = effective(s, p), d = state.decisions[s.id], h = state.holds[s.id];
  $("schoolName").textContent = s.name;
  $("hiRoAM").textContent = `${state.hi.am}°C`; $("hiRoPM").textContent = `${state.hi.pm}°C`; $("cutoffRo").textContent = `Reply by ${state.rule.cutoff}`;
  $("holdBanner").hidden = !h; if (h) $("holdBanner").innerHTML = `<b>Division hold:</b> ${HOLDS[h].label}. Plan set to ${MODE[HOLDS[h].mode]}.`;

  // SMS thread
  const thread = state.smsThread[s.id] || [];
  $("phone").innerHTML = `<h3>SMS</h3><div class="bubble">${esc(headSms(s, p))}</div>${thread.map((m) => `<div class="bubble ${m.me ? "me" : ""}">${esc(m.text)}</div>`).join("")}
    <form class="reply" id="smsForm"><input id="smsIn" inputmode="numeric" maxlength="1" placeholder="1, 2 or 3" aria-label="Reply" ${h ? "disabled" : ""}><button type="submit" ${h ? "disabled" : ""}>Send</button></form>`;
  $("smsForm").addEventListener("submit", (e) => {
    e.preventDefault(); const v = $("smsIn").value.trim(); const choice = SMS_CODES[v];
    const t = (state.smsThread[s.id] ??= []); t.push({ me: true, text: v || "?" });
    if (!choice) t.push({ me: false, text: "Reply 1, 2 or 3." });
    else { decide(s, choice, choice === "confirm" ? "" : "via SMS", "sms"); t.push({ me: false, text: `Recorded: ${choice === "confirm" ? `Confirm (${MODE[p.mode]})` : MODE[choice]}.` }); }
    render();
  });

  // reasons
  $("reasons").innerHTML = `<h3>Why ${MODE[p.mode].toLowerCase()}</h3><div class="hours">${hoursSvg()}</div>
    <div class="why">${s.buildings.map((b) => `<div><i class="band" style="display:inline-block;background:${BCOL[band(Math.max(state.hi.am, state.hi.pm), b.features).band]}"></i> ${esc(b.name)} · ${b.rooms} room${b.rooms === 1 ? "" : "s"} · <b>${buildingLine(b)}</b></div>`).join("")}</div>
    <div class="muted" style="font-size:13px">${esc(p.why)}</div>`;

  // decision
  const isOverride = d && d.choice !== "confirm";
  $("decide").innerHTML = `
    <div class="plan"><span class="muted">Recommended</span><span class="badge b-${p.mode}">${MODE[p.mode]}</span>${d ? `<span class="ok">${d.choice === "confirm" ? "Confirmed" : `Override: ${MODE[d.choice]}`} · ${d.at}${d.via === "sms" ? " · SMS" : ""}</span>` : ""}</div>
    <div class="seg"><button id="confirm" ${h ? "disabled" : ""} aria-pressed="${d?.choice === "confirm"}">Confirm</button></div>
    <form class="ovr" id="ovrForm"><select id="ovrMode" aria-label="Override to" ${h ? "disabled" : ""}>${["full", "morning", "afternoon", "adm"].filter((m) => m !== p.mode).map((m) => `<option value="${m}" ${isOverride && d.choice === m ? "selected" : ""}>${MODE[m]}</option>`).join("")}</select><input id="ovrReason" placeholder="Reason (required)" value="${isOverride ? esc(d.reason) : ""}" aria-label="Reason" ${h ? "disabled" : ""}><button type="submit" ${h ? "disabled" : ""}>Override</button></form>
    <div class="err" id="ovrErr" style="color:var(--adm);font-size:13px"></div>`;
  $("confirm").addEventListener("click", () => { decide(s, "confirm", "", "link"); render(); });
  $("ovrForm").addEventListener("submit", (e) => {
    e.preventDefault(); const reason = $("ovrReason").value.trim(); const mode = $("ovrMode").value;
    if (!MODE[mode] || mode === p.mode) { $("ovrErr").textContent = "Pick a plan different from the recommendation."; return; }
    if (!reason) { $("ovrErr").textContent = "Add a one-line reason."; return; }
    decide(s, mode, reason, "link"); render();
  });

  // parents
  const decided = !!d || !!h;
  const msg = parentMessage(s, ep, state.lang);
  $("parents").innerHTML = `<div class="plan"><h3>Parents</h3><span class="seg">${[["en", "English"], ["tl", "Filipino"], ["hil", "Hiligaynon"]].map(([k, l]) => `<button data-l="${k}" aria-pressed="${state.lang === k}">${l}</button>`).join("")}</span></div>
    ${msg === null ? `<div class="muted">Full day: no message needed.</div>` : `<div class="sms" id="pmsg">${esc(msg)}</div>
    <div class="chips"><button id="send" ${!decided || state.sent[s.id] ? "disabled" : ""} aria-pressed="${!!state.sent[s.id]}">${state.sent[s.id] ? "Sent" : "Send to parents"}</button><button id="pcopy">Copy</button>${!decided ? `<span class="muted">Decide first</span>` : ""}${state.lang === "hil" ? `<span class="muted">Draft: check wording</span>` : ""}</div>`}`;
  $("parents").querySelectorAll("[data-l]").forEach((b) => b.addEventListener("click", () => { state.lang = b.dataset.l; render(); }));
  if (msg !== null) {
    $("send").addEventListener("click", () => { state.sent[s.id] = true; render(); });
    $("pcopy").addEventListener("click", async () => { try { await navigator.clipboard.writeText($("pmsg").textContent); $("pcopy").textContent = "Copied"; } catch { $("pcopy").textContent = "Copy failed"; } });
  }

  // buildings: confirm inventory + questions
  const pending = s.buildings.filter((b) => b.inv === null).length;
  $("setupState").textContent = pending ? `${pending} to confirm` : "confirmed";
  $("buildings").innerHTML = s.buildings.map((b) => {
    const sel = (k, o) => `<select data-q="${k}" data-b="${b.id}" aria-label="${k}">${Object.entries(o).map(([v, l]) => `<option value="${v}" ${b.c[k] === v ? "selected" : ""}>${l}</option>`).join("")}</select>`;
    const chk = (k) => `<input type="checkbox" data-q="${k}" data-b="${b.id}" ${b.c[k] ? "checked" : ""}>`;
    return `<div class="bl"><div class="bl-head"><b>${esc(b.name)}</b><span class="muted mono">${b.rooms} rooms</span></div>
      <div class="inv"><span class="mono muted">${esc(b.nsbi.type)} · ${b.nsbi.storeys} storey${b.nsbi.storeys > 1 ? "s" : ""} · ${esc(b.nsbi.cls)}</span><span>Correct?</span><button data-inv="${b.id}" data-v="1" aria-pressed="${b.inv === true}">Yes</button><button data-inv="${b.id}" data-v="0" aria-pressed="${b.inv === false}">No</button>${b.inv === false ? `<span class="warn">Flagged to division</span>` : ""}</div>
      <div class="qs"><label>Ceiling ${sel("ceiling", { yes: "Yes", no: "No", na: "n/a" })}</label><label>Windows ${sel("windows", { both: "Both sides", one: "One side", poor: "Poor" })}</label><label>${chk("west")} Faces west</label><label>${chk("shade")} Shaded</label><label>${chk("aircon")} A/C</label></div></div>`;
  }).join("");
  $("buildings").querySelectorAll("[data-inv]").forEach((el) => el.addEventListener("click", () => { const b = s.buildings.find((x) => x.id === el.dataset.inv); b.inv = el.dataset.v === "1"; $("setupCard").open = true; render(); }));
  $("buildings").querySelectorAll("[data-q]").forEach((el) => el.addEventListener("change", () => {
    const b = s.buildings.find((x) => x.id === el.dataset.b);
    b.c = { ...b.c, [el.dataset.q]: el.type === "checkbox" ? el.checked : el.value };
    b.features = featuresFrom(b.nsbi, b.c); $("setupCard").open = true; render();
  }));
}

// ---------- render ----------
function render() {
  const div = planDivision(state.schools, state.hi);
  let conflicts = 0; div.plans.forEach((p, i) => (conflicts += check(state.schools[i], p).length));
  const byId = Object.fromEntries(div.plans.map((p) => [p.school, p]));
  const u = state.user;
  $("login").hidden = !!u; $("topbar").hidden = !u; $("sources").hidden = !u;
  $("sdo").hidden = !u || u.role !== "sdo"; $("head").hidden = !u || u.role !== "head";
  if (!u) return;
  $("whoEmail").textContent = u.email;
  $("brandSub").textContent = u.role === "sdo" ? "Division coordinator · Iloilo City" : "School head";
  if (u.role === "head") renderHead(byId); else renderSdo(div, byId, conflicts);
}

// ---------- forecast inputs ----------
function setWindows(am, pm) { if (am !== state.hi.am || pm !== state.hi.pm) { state.decisions = {}; state.sent = {}; state.smsThread = {}; } state.hi = { am, pm }; }
function loadSource() {
  state.manual = false;
  const days = state.source === "forecast" ? state.forecastDays : REPLAYS;
  state.day = state.source === "forecast" ? (Object.keys(days).sort()[1] || Object.keys(days)[0]) : state.source;
  const w = windowsFromHourly(days[state.day]);
  state.hourly = w.hourly; setWindows(w.am, w.pm); render();
}
$("source").innerHTML = `<option value="forecast">Forecast · tomorrow</option>` + Object.keys(REPLAYS).sort().map((d) => `<option value="${d}">Replay · ${d}</option>`).join("");
$("source").addEventListener("change", (e) => { state.source = e.target.value; loadSource(); });
for (const w of ["AM", "PM"]) $(`hi${w}`).addEventListener("change", (e) => {
  const n = +e.target.value; if (!Number.isFinite(n)) return; const v = Math.max(20, Math.min(60, Math.round(n * 10) / 10));
  setWindows(w === "AM" ? v : state.hi.am, w === "PM" ? v : state.hi.pm); state.manual = true; render();
});
fetch("https://api.open-meteo.com/v1/forecast?latitude=10.72&longitude=122.56&hourly=temperature_2m,relative_humidity_2m&timezone=Asia%2FManila&forecast_days=3")
  .then((r) => (r.ok ? r.json() : Promise.reject()))
  .then((d) => {
    const days = {};
    d.hourly.time.forEach((t, i) => { const [day, hh] = t.split("T"); const h = +hh.slice(0, 2); if (h >= 6 && h <= 17) (days[day] ??= []).push({ h, t: d.hourly.temperature_2m[i], rh: d.hourly.relative_humidity_2m[i] }); });
    state.forecastDays = days; state.live = true;
    if (state.source === "forecast" && !state.manual) loadSource();
  }).catch(() => {});

// ---------- coordinator actions ----------
$("aRemind").addEventListener("click", () => showOut(reportText("remind")));
$("aMayor").addEventListener("click", () => showOut(reportText("mayor")));
$("aRegion").addEventListener("click", () => showOut(reportText("region")));
$("outClose").addEventListener("click", () => { $("outBox").hidden = true; });
$("outCopy").addEventListener("click", async () => { try { await navigator.clipboard.writeText($("out").textContent); $("outCopy").textContent = "Copied"; } catch { $("outCopy").textContent = "Copy failed"; } setTimeout(() => ($("outCopy").textContent = "Copy"), 1500); });

// ---------- sign-in: the account decides the view ----------
const slug = (name) => name.toLowerCase().replace(/elementary school/, "es").replace(/national high school/, "nhs").replace(/integrated school/, "is").replace(/[^a-z0-9]+/g, ".").replace(/^\.+|\.+$/g, "");
const SDO_EMAIL = "sdo.iloilocity@deped.gov.ph";
const ACCOUNTS = new Map([[SDO_EMAIL, { role: "sdo" }]]);
for (const s of state.schools) ACCOUNTS.set(`head.${slug(s.name)}@deped.gov.ph`, { role: "head", school: s.id });
$("accounts").innerHTML = [...ACCOUNTS.keys()].map((e) => `<option value="${e}">`).join("");
const pandac = state.schools.find((s) => /pandac/i.test(s.name)) || state.schools[0];
const other = state.schools.find((s) => /iloilo central/i.test(s.name)) || state.schools[1];
const DEMO = [[SDO_EMAIL, "Division coordinator"], [`head.${slug(pandac.name)}@deped.gov.ph`, `Head · ${pandac.name}`], [`head.${slug(other.name)}@deped.gov.ph`, `Head · ${other.name}`]];
$("demo").innerHTML = DEMO.map(([e, l]) => `<button type="button" data-email="${e}">${esc(l)}<span>${esc(e)}</span></button>`).join("");
$("demo").querySelectorAll("button").forEach((b) => b.addEventListener("click", () => { $("email").value = b.dataset.email; signIn(); }));
function signIn() {
  const email = $("email").value.trim().toLowerCase(); const acc = ACCOUNTS.get(email);
  if (!acc) { $("err").textContent = email ? "No Presko account for this email." : "Enter your DepEd email."; return; }
  $("err").textContent = ""; state.user = { email, ...acc }; if (acc.role === "head") state.school = acc.school; render();
}
$("login").addEventListener("submit", (e) => { e.preventDefault(); signIn(); });
$("signout").addEventListener("click", () => { state.user = null; $("email").value = ""; render(); $("email").focus(); });
state.user = null;
loadSource();
</script>

</body>
</html>
